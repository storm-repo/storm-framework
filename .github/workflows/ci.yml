name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Rapid pushes to a PR queue duplicate runs; supersede them. Runs on main keep
# going so every merge commit gets its coverage upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Check formatting
        run: mvn spotless:check -B

      - name: Build and test
        run: mvn verify -B

      - name: Install Storm artifacts for the Gradle plugin smoke test
        run: mvn install -DskipTests -B

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test Gradle plugin
        working-directory: storm-gradle-plugin
        run: ./gradlew build -Dstorm.smoke=true

      - name: Upload coverage to Codecov
        # Dependabot-triggered runs receive no repository secrets, so the token is empty there and the
        # upload fails; skip it, the build and tests still gate the PR.
        if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: true

  # The CLI ships to users via npx but is plain JavaScript with no compile step,
  # so at minimum its syntax must be checked before merge.
  cli-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check the CLI
        run: node --check storm-cli/storm.mjs
